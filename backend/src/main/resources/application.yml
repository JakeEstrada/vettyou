spring:
  application:
    name: vettyou
  config:
    import: optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

vettyou:
  ai:
    api-key: ${OPENAI_API_KEY:${AI_API_KEY:}}
    model: ${AI_MODEL:}
    base-url: https://api.openai.com/v1
    timeout-seconds: 300
  mail:
    encryption-key: ${MAIL_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/vettyou}
    username: ${SPRING_DATASOURCE_USERNAME:vettyou}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}

---
spring:
  config:
    activate:
      on-profile: test
vettyou:
  ai:
    api-key: ""
    model: ""
  mail:
    encryption-key: test-mail-encryption-key-not-for-prod
