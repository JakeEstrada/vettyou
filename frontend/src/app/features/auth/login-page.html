<section class="page" aria-labelledby="login-heading">
  <h1 id="login-heading">Log in</h1>
  <p class="lede">Use the email and password from your account.</p>
  <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Email
      <input id="email" type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched" />
      @if (form.controls.email.touched && form.controls.email.errors?.['required']) {
        <span class="field-error">Email is required.</span>
      } @else if (form.controls.email.touched && form.controls.email.errors?.['email']) {
        <span class="field-error">Enter a valid email.</span>
      }
    </label>
    <label>
      Password
      <input id="password" type="password" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched" />
      @if (form.controls.password.touched && form.controls.password.errors?.['required']) {
        <span class="field-error">Password is required.</span>
      } @else if (form.controls.password.touched && form.controls.password.errors?.['minlength']) {
        <span class="field-error">Use at least 8 characters.</span>
      }
    </label>
    @if (formError()) {
      <p class="form-error" role="alert">{{ formError() }}</p>
    }
    <button type="submit">Log in</button>
  </form>
  <p class="lede"><a routerLink="/register">Create an account</a></p>
</section>
