<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Until Saturday</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #countdown {
      font-size: clamp(1.5rem, 8vw, 4rem);
      letter-spacing: 0.02em;
      text-align: center;
      padding: 1rem;
      line-height: 1.35;
      white-space: nowrap;
    }
    @media (max-width: 520px) {
      #countdown {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div id="countdown" aria-live="polite"></div>
  <script>
    function nextSaturdayStart() {
      const now = new Date();
      let t = new Date(now);
      t.setHours(0, 0, 0, 0);
      const dow = t.getDay();
      const daysUntilSat = (6 - dow + 7) % 7;
      t.setDate(t.getDate() + daysUntilSat);
      if (t < now) {
        t.setDate(t.getDate() + 7);
      }
      return t;
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function tick() {
      const target = nextSaturdayStart();
      const now = new Date();
      let ms = target - now;
      if (ms < 0) ms = 0;

      const totalMin = Math.floor(ms / 60000);
      const days = Math.floor(totalMin / (60 * 24));
      const hours = Math.floor((totalMin % (60 * 24)) / 60);
      const minutes = totalMin % 60;

      const el = document.getElementById("countdown");
      el.textContent =
        days + "d " + pad(hours) + "h " + pad(minutes) + "m";
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
