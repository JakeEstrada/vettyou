<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #vid {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: black;
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      z-index: 10;
      user-select: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #overlay img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #overlay.hidden {
      display: none;
    }

    #soundHint {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      display: none;
    }

    #soundHint.show {
      display: block;
    }
  </style>
</head>
<body>
  <div id="overlay" role="button" tabindex="0" aria-label="Tap to play video">
    <img src="tallboys.png" alt="" decoding="async" />
  </div>
  <button type="button" id="soundHint" aria-label="Tap to turn sound on">Tap for sound</button>

  <video id="vid" playsinline webkit-playsinline preload="auto" fetchpriority="high">
    <source src="output.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <script>
    const vid = document.getElementById("vid");
    const overlay = document.getElementById("overlay");
    const soundHint = document.getElementById("soundHint");
    let started = false;
    let prewarmDone = false;

    /** Start muted decode/buffer on press — iOS often waits for a gesture; this uses finger-down time before release. */
    function prewarmPlay() {
      if (started || prewarmDone) return;
      prewarmDone = true;
      vid.muted = true;
      const p = vid.play();
      if (p !== undefined) p.catch(() => {});
    }

    function tryFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    }

    /**
     * iOS Safari requires play() to run in the same turn as the user tap.
     * async/await before play() breaks that and muted video is blocked less often,
     * so we try unmuted first, then muted play + unmute in the same promise chain.
     */
    function startVideo(evt) {
      if (started) return;
      started = true;
      evt?.preventDefault?.();

      overlay.classList.add("hidden");
      vid.volume = 1;

      const run = () => {
        tryFullscreen();
      };

      vid.muted = false;
      const p = vid.play();
      if (p === undefined) {
        run();
        return;
      }

      p.then(run).catch(() => {
        vid.muted = true;
        return vid.play().then(() => {
          vid.muted = false;
          run();
        });
      }).catch(() => {
        started = false;
        overlay.classList.remove("hidden");
      });

      vid.addEventListener(
        "playing",
        function maybeShowSoundHint() {
          setTimeout(() => {
            if (!vid.muted || vid.paused) return;
            soundHint.classList.add("show");
          }, 120);
        },
        { once: true }
      );
    }

    function unmuteFromHint(e) {
      e.preventDefault();
      vid.muted = false;
      soundHint.classList.remove("show");
    }

    soundHint.addEventListener("click", unmuteFromHint);
    soundHint.addEventListener("touchend", unmuteFromHint, { passive: false });

    overlay.addEventListener("pointerdown", prewarmPlay, { passive: true });
    overlay.addEventListener("touchstart", prewarmPlay, { passive: true });
    overlay.addEventListener("click", startVideo);
    overlay.addEventListener(
      "touchend",
      (e) => {
        startVideo(e);
      },
      { passive: false }
    );
    overlay.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        startVideo(e);
      }
    });
  </script>
</body>
</html>
