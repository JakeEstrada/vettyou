<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #vid {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: black;
      display: block;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
      z-index: 10;
      user-select: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #overlay img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #overlay.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="overlay" role="button" tabindex="0" aria-label="Tap to play video">
    <img src="tallboys.png" alt="" decoding="async" />
  </div>

  <video id="vid" playsinline webkit-playsinline preload="auto">
    <source src="tallboyshoes.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <script>
    const vid = document.getElementById("vid");
    const overlay = document.getElementById("overlay");
    let started = false;

    function tryFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    }

    /**
     * iOS Safari requires play() to run in the same turn as the user tap.
     * async/await before play() breaks that and muted video is blocked less often,
     * so we try unmuted first, then muted play + unmute in the same promise chain.
     */
    function startVideo(evt) {
      if (started) return;
      started = true;
      evt?.preventDefault?.();

      overlay.classList.add("hidden");
      vid.volume = 1;

      const run = () => {
        tryFullscreen();
      };

      vid.muted = false;
      const p = vid.play();
      if (p === undefined) {
        run();
        return;
      }

      p.then(run).catch(() => {
        vid.muted = true;
        return vid.play().then(() => {
          vid.muted = false;
          run();
        });
      }).catch(() => {
        started = false;
        overlay.classList.remove("hidden");
      });
    }

    overlay.addEventListener("click", startVideo);
    overlay.addEventListener(
      "touchend",
      (e) => {
        startVideo(e);
      },
      { passive: false }
    );
    overlay.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        startVideo(e);
      }
    });
  </script>
</body>
</html>
