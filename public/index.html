<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ice Cream — All your faves, all in one place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #e0f2f7;
      --tan: #c5a885;
      --navy: #001f3f;
      --cream: #fdf8f0;
      --yellow-pattern: rgba(255, 214, 102, 0.35);
      --nav-shadow: 0 8px 32px rgba(0, 31, 63, 0.08);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--navy);
      background: var(--cream);
    }

    body.video-playing {
      overflow: hidden;
    }

    #vid {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      display: block;
      background: #000;
      pointer-events: none;
    }

    body.video-playing #vid {
      z-index: 100;
      pointer-events: auto;
    }

    .landing {
      position: relative;
      z-index: 2;
    }

    body.video-playing .landing {
      display: none;
    }

    #soundHint {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      font-family: "Montserrat", system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      border: none;
      display: none;
    }

    #soundHint.show {
      display: block;
    }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .utility {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px clamp(16px, 4vw, 48px);
      background: var(--cream);
      border-bottom: 1px solid rgba(0, 31, 63, 0.06);
    }

    .utility__brands {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      min-width: 0;
    }

    .brand-pill {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid rgba(0, 31, 63, 0.12);
      color: var(--navy);
      white-space: nowrap;
    }

    .utility__links {
      display: flex;
      gap: clamp(16px, 3vw, 28px);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 14px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .hero-area {
      position: relative;
      z-index: 1;
    }

    .nav-shell {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      transform: translateY(-42%);
      z-index: 20;
      padding: 0 clamp(12px, 3vw, 40px);
      pointer-events: none;
    }

    .nav-shell .main-nav,
    .nav-shell a,
    .nav-shell button {
      pointer-events: auto;
    }

    .main-nav {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px clamp(16px, 3vw, 32px);
      background: #fff;
      border-radius: 999px;
      box-shadow: var(--nav-shadow);
      min-height: 64px;
    }

    .main-nav__group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(8px, 1.6vw, 20px);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(12px, 1.25vw, 15px);
      font-weight: 500;
    }

    .main-nav__group--left {
      justify-content: flex-end;
      padding-right: min(56px, 6vw);
    }

    .main-nav__group--right {
      justify-content: flex-start;
      padding-left: min(56px, 6vw);
    }

    .main-nav__logo-wrap {
      position: relative;
      justify-self: center;
      margin-top: -52px;
      z-index: 2;
    }

    .main-nav__logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(0, 31, 63, 0.12);
      box-shadow: 0 10px 28px rgba(0, 31, 63, 0.1);
    }

    .main-nav__logo svg {
      width: 36px;
      height: 36px;
      margin-top: 4px;
    }

    .main-nav__logo-text {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 2px;
    }

    .main-nav__search {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--navy);
      cursor: pointer;
    }

    .main-nav__search:hover {
      background: rgba(0, 31, 63, 0.06);
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      min-height: min(78vh, 720px);
      padding-top: clamp(48px, 7vw, 88px);
    }

    .hero__left {
      position: relative;
      background: var(--blue);
      padding: clamp(32px, 6vw, 80px) clamp(24px, 5vw, 72px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
    }

    .hero__kicker {
      font-size: clamp(13px, 1.4vw, 15px);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--navy);
      margin: 0;
    }

    .hero__title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2rem, 4.2vw, 3.25rem);
      font-weight: 700;
      line-height: 1.12;
      margin: 0;
      max-width: 14ch;
    }

    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 16px 28px;
      border: none;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-family: "Montserrat", system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0, 31, 63, 0.25);
    }

    .hero__cta:hover {
      filter: brightness(1.08);
    }

    .hero__cta span {
      font-size: 1.1em;
      line-height: 1;
    }

    .hero__right {
      position: relative;
      background: var(--tan);
      overflow: hidden;
      border-bottom-left-radius: clamp(48px, 12vw, 120px);
      min-height: 280px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hero__right:focus {
      outline: 2px solid var(--navy);
      outline-offset: 4px;
    }

    .hero__pattern {
      position: absolute;
      inset: -40% -20%;
      background: repeating-linear-gradient(
        -32deg,
        transparent,
        transparent 48px,
        var(--yellow-pattern) 48px,
        var(--yellow-pattern) 50px
      );
      pointer-events: none;
      opacity: 0.9;
    }

    .hero__pattern-text {
      position: absolute;
      inset: 0;
      font-family: "Montserrat", sans-serif;
      font-weight: 600;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -0.02em;
      color: rgba(255, 214, 102, 0.22);
      white-space: nowrap;
      transform: rotate(-18deg) translate(-5%, 18%);
      user-select: none;
      pointer-events: none;
    }

    .hero__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 78% 22%;
      mix-blend-mode: normal;
    }

    .a11y-fab {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .a11y-fab:hover {
      transform: scale(1.05);
    }

    @media (max-width: 900px) {
      .main-nav__group--left,
      .main-nav__group--right {
        display: none;
      }

      .main-nav {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 16px;
      }

      .main-nav__logo-wrap {
        margin-top: -48px;
      }

      .nav-shell {
        transform: translateY(-28%);
      }

      .hero {
        grid-template-columns: 1fr;
        padding-top: 72px;
      }

      .hero__right {
        order: -1;
        min-height: 42vh;
        border-bottom-left-radius: 64px;
        border-bottom-right-radius: 64px;
      }

      .hero__left {
        padding-bottom: 56px;
      }
    }

    @media (max-width: 520px) {
      .utility__brands .brand-pill:nth-child(n + 5) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <video id="vid" playsinline webkit-playsinline preload="auto" fetchpriority="high">
    <source src="output.mp4" type="video/mp4" />
    Your browser does not support HTML5 video.
  </video>

  <div class="landing">
  <div class="utility">
    <div class="utility__brands" aria-label="Featured brands">
      <span class="brand-pill">Häagen-Dazs</span>
      <span class="brand-pill">Outshine</span>
      <span class="brand-pill">Drumstick</span>
      <span class="brand-pill">Oreo</span>
      <span class="brand-pill">Skinny Cow</span>
      <span class="brand-pill">Dreyer’s</span>
    </div>
    <div class="utility__links">
      <a href="#">Corporate</a>
      <a href="#">Foodservice</a>
    </div>
  </div>

  <div class="hero-area">
    <div class="nav-shell">
      <nav class="main-nav" aria-label="Primary">
        <div class="main-nav__group main-nav__group--left">
          <a href="#">Products</a>
          <a href="#">Recipes</a>
          <a href="#">Experience Ice Cream</a>
        </div>
        <div class="main-nav__logo-wrap">
          <a href="#" class="main-nav__logo" aria-label="Ice Cream home">
            <span class="main-nav__logo-text">Ice Cream</span>
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M24 8c-4 0-7 2.5-7 6 0 1.2.4 2.3 1 3.2L14 38h20L30 17.2c.6-.9 1-2 1-3.2 0-3.5-3-6-7-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M17 22h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M19 28h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </a>
        </div>
        <div class="main-nav__group main-nav__group--right">
          <a href="#">Brands</a>
          <a href="#">Flavor Finder</a>
          <a href="#">Flavor Quiz</a>
          <button type="button" class="main-nav__search" aria-label="Search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-4-4" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </nav>
    </div>
    <main class="hero">
      <section class="hero__left" aria-labelledby="hero-heading">
        <p class="hero__kicker">The best ice cream brands</p>
        <h1 id="hero-heading" class="hero__title">All your faves, all in one place.</h1>
        <button type="button" class="hero__cta js-play">Get the scoop! <span aria-hidden="true">→</span></button>
      </section>
      <div
        class="hero__right js-play"
        role="button"
        tabindex="0"
        aria-label="Play video"
      >
        <div class="hero__pattern"></div>
        <div class="hero__pattern-text">Craviest. Yummiest. Craviest. Yummiest.</div>
        <img class="hero__img" src="tallboys.png" alt="" decoding="async" />
      </div>
    </main>
  </div>

  <button type="button" class="a11y-fab" aria-label="Accessibility options">co</button>
  </div>

  <button type="button" id="soundHint" aria-label="Tap to turn sound on">Tap for sound</button>

  <script>
    const vid = document.getElementById("vid");
    const soundHint = document.getElementById("soundHint");
    const playTargets = document.querySelectorAll(".js-play");
    let started = false;
    let prewarmDone = false;

    function prewarmPlay() {
      if (started || prewarmDone) return;
      prewarmDone = true;
      vid.muted = true;
      const p = vid.play();
      if (p !== undefined) p.catch(() => {});
    }

    function tryFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    }

    function startVideo(evt) {
      if (started) return;
      started = true;
      evt?.preventDefault?.();

      document.body.classList.add("video-playing");
      vid.volume = 1;

      const run = () => {
        tryFullscreen();
      };

      vid.muted = false;
      const p = vid.play();
      if (p === undefined) {
        run();
        return;
      }

      p.then(run).catch(() => {
        vid.muted = true;
        return vid.play().then(() => {
          vid.muted = false;
          run();
        });
      }).catch(() => {
        started = false;
        document.body.classList.remove("video-playing");
      });

      vid.addEventListener(
        "playing",
        function maybeShowSoundHint() {
          setTimeout(() => {
            if (!vid.muted || vid.paused) return;
            soundHint.classList.add("show");
          }, 120);
        },
        { once: true }
      );
    }

    function unmuteFromHint(e) {
      e.preventDefault();
      vid.muted = false;
      soundHint.classList.remove("show");
    }

    soundHint.addEventListener("click", unmuteFromHint);
    soundHint.addEventListener("touchend", unmuteFromHint, { passive: false });

    playTargets.forEach((el) => {
      el.addEventListener("pointerdown", prewarmPlay, { passive: true });
      el.addEventListener("touchstart", prewarmPlay, { passive: true });
      el.addEventListener("click", startVideo);
      el.addEventListener(
        "touchend",
        (e) => {
          startVideo(e);
        },
        { passive: false }
      );
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          startVideo(e);
        }
      });
    });
  </script>
</body>
</html>
